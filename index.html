    .history-empty { text-align: center; font-size: 11px; color: #52525b; padding: 10px; }

    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .compare-grid select { margin-bottom: 0; font-size: 12px; padding: 12px 14px; }
    .compare-result {
      margin-top: 16px; padding: 16px; background: rgba(0, 0, 0, 0.5);
      border-radius: 14px; border: 1px solid rgba(212, 175, 55, 0.2); display: none;

    .compare-result.show { display: block; animation: fadeIn 0.4s ease; }
    .compare-result h3 { font-size: 12px; color: #d4af37; text-align: center; margin-bottom: 14px; letter-spacing: 1px; text-transform: uppercase; }
    .compare-team-row {
      display: flex; align-items: center; gap: 10px; padding: 10px;
      background: rgba(0, 0, 0, 0.3); border-radius: 10px; margin-bottom: 8px;
      border: 1px solid rgba(212, 175, 55, 0.1);
    }
    .compare-team-row.winner-row { border-color: #d4af37; background: rgba(212, 175, 55, 0.08); }
    .compare-logo {

    .compare-info { flex: 1; min-width: 0; }
    .compare-name { font-size: 12px; color: #f5f5f5; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .compare-pct { font-size: 16px; color: #d4af37; font-weight: 800; }

    .watermark { text-align: center; font-size: 10px; color: #52525b; margin-top: 18px; letter-spacing: 1px; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px);

    .modal-overlay.show { display: flex; animation: fadeIn 0.3s ease; }
    .modal-content {

  </style>
</head>

    const btnPrediksi = document.getElementById('btnPrediksi');
    const resultDiv = document.getElementById('result');
    const loadingEl = document.getElementById('loading');
    const apiBadge = document.getElementById('apiBadge');

    let lastResult = {};
    const apiCache = {};

    function getInitials(name) {
      if (!name) return '?';
      const words = name.trim().split(/\s+/);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      return (words[0][0] + words[words.length - 1][0]).toUpperCase();
    }

    function updateLogos() {
      const timA = timASelect.value, timB = timBSelect.value, liga = ligaSelect.value;
      const logoA = document.getElementById('logoA'), logoB = document.getElementById('logoB');
      const logoNameA = document.getElementById('logoNameA'), logoNameB = document.getElementById('logoNameB');
      const cached = apiCache[liga] || {};

      if (timA) {
        logoNameA.textContent = timA;
        const url = cached[timA]?.logo;
        logoA.innerHTML = url ? `<img src="${url}" alt="${timA}" onerror="this.parentNode.textContent='${getInitials(timA)}'">` : getInitials(timA);
      } else { logoA.textContent = '?'; logoNameA.textContent = 'Tim A'; }

      if (timB) {
        logoNameB.textContent = timB;
        const url = cached[timB]?.logo;
        logoB.innerHTML = url ? `<img src="${url}" alt="${timB}" onerror="this.parentNode.textContent='${getInitials(timB)}'">` : getInitials(timB);
      } else { logoB.textContent = '?'; logoNameB.textContent = 'Tim B'; }
    }

    async function fetchLiga(liga) {
      if (apiCache[liga]) return apiCache[liga];
      if (!API_LIGA.includes(liga)) {
        const fb = teamsDataFallback[liga] || {};
        const obj = {}; Object.keys(fb).forEach(t => obj[t] = { score: fb[t], logo: null });
        return obj;
      }
      try {
        loadingEl.classList.add('show');
        const res = await fetch(`${API_URL}/?liga=${liga}`);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();
        if (data.teams) {
          apiCache[liga] = data.teams;
          return data.teams;
        }
        throw new Error('No teams');
      } catch (e) {
        const fb = teamsDataFallback[liga] || {};
        const obj = {}; Object.keys(fb).forEach(t => obj[t] = { score: fb[t], logo: null });
        return obj;
      } finally {
        loadingEl.classList.remove('show');
      }
    }

    ligaSelect.addEventListener('change', async () => {
      const liga = ligaSelect.value;
      timASelect.innerHTML = '<option value="">Loading...</option>';
      timBSelect.innerHTML = '<option value="">Loading...</option>';
      resultDiv.classList.remove('show');
      apiBadge.textContent = ''; apiBadge.className = 'api-badge';

      if (!liga) {
        timASelect.innerHTML = '<option value="">Tim A</option>';
        timBSelect.innerHTML = '<option value="">Tim B</option>';
        return;
      }

      const data = await fetchLiga(liga);
      const list = Object.keys(data);

      timASelect.innerHTML = '<option value="">Tim A</option>';
      timBSelect.innerHTML = '<option value="">Tim B</option>';
      list.forEach(t => {
        timASelect.innerHTML += `<option value="${t}">${t}</option>`;
        timBSelect.innerHTML += `<option value="${t}">${t}</option>`;
      });

      if (API_LIGA.includes(liga)) {
        apiBadge.textContent = '⚡ Data live dari Football-Data.org';
        apiBadge.classList.add('live');
      } else {
        apiBadge.textContent = '📋 Data manual';
        apiBadge.classList.add('manual');
      }
      updateLogos();
    });

    timASelect.addEventListener('change', updateLogos);
    timBSelect.addEventListener('change', updateLogos);

    btnPrediksi.addEventListener('click', () => {
      const timA = timASelect.value, timB = timBSelect.value, liga = ligaSelect.value;
      if (!timA || !timB) { alert('Pilih Tim A dan Tim B dulu bre!'); return; }
      if (timA === timB) { alert('Tim A dan Tim B gak boleh sama bre!'); return; }

      let skorA, skorB;
      if (apiCache[liga] && apiCache[liga][timA]) {
        skorA = apiCache[liga][timA].strength;
        skorB = apiCache[liga][timB]?.strength || 75;
      } else {
        const fb = teamsDataFallback[liga] || {};
        skorA = fb[timA] || 75; skorB = fb[timB] || 75;
      }

      const total = skorA + skorB;
      const drawWeight = 15;
      const pctA = Math.round((skorA / total) * (100 - drawWeight));
      const pctB = Math.round((skorB / total) * (100 - drawWeight));
      const pctDraw = 100 - pctA - pctB;

      document.getElementById('resultTitle').innerHTML = `<strong>${timA}</strong> vs <strong>${timB}</strong>`;
      document.getElementById('labelA').textContent = timA;
      document.getElementById('labelB').textContent = timB;
      document.getElementById('pctA').textContent = pctA + '%';
      document.getElementById('pctDraw').textContent = pctDraw + '%';
      document.getElementById('pctB').textContent = pctB + '%';
      resultDiv.classList.add('show');

      document.getElementById('fillA').style.width = '0';
      document.getElementById('fillDraw').style.width = '0';
      document.getElementById('fillB').style.width = '0';
      setTimeout(() => {
        document.getElementById('fillA').style.width = pctA + '%';
        document.getElementById('fillDraw').style.width = pctDraw + '%';
        document.getElementById('fillB').style.width = pctB + '%';
      }, 100);

      let winnerText = '';
      if (pctA > pctB && pctA > pctDraw) winnerText = `🏆 Unggulan: <strong>${timA}</strong>`;
      else if (pctB > pctA && pctB > pctDraw) winnerText = `🏆 Unggulan: <strong>${timB}</strong>`;
      else winnerText = `🤝 Prediksi: <strong>Draw</strong>`;
      document.getElementById('winner').innerHTML = winnerText;

      lastResult = { timA, timB, pctA, pctB, pctDraw, winner: winnerText.replace(/<[^>]*>/g, '') };
      saveHistory({ match: `${timA} vs ${timB}`, winner: winnerText.replace(/<[^>]*>/g, '').replace('🏆 Unggulan: ','').replace('🤝 Prediksi: ','') });
    });

    // COMPARE MODE
    const ligaCompare = document.getElementById('ligaCompare');
    const cTim1 = document.getElementById('cTim1'), cTim2 = document.getElementById('cTim2'),
          cTim3 = document.getElementById('cTim3'), cTim4 = document.getElementById('cTim4');

    ligaCompare.addEventListener('change', async () => {
      const liga = ligaCompare.value;
      [cTim1, cTim2, cTim3, cTim4].forEach(s => s.innerHTML = '<option value="">Loading...</option>');

      if (!liga) {
        [cTim1, cTim2, cTim3, cTim4].forEach(s => s.innerHTML = '<option value="">-</option>');
        return;
      }

      const data = await fetchLiga(liga);
      const list = Object.keys(data);

      [cTim1, cTim2, cTim3, cTim4].forEach((s, i) => {
        s.innerHTML = `<option value="">Tim ${i+1}${i===3?' (opsional)':''}</option>`;
        list.forEach(t => { s.innerHTML += `<option value="${t}">${t}</option>`; });
      });
    });

    document.getElementById('btnCompare').addEventListener('click', () => {
      const liga = ligaCompare.value;
      const tims = [cTim1.value, cTim2.value, cTim3.value, cTim4.value].filter(Boolean);

      if (tims.length < 3) { alert('Pilih minimal 3 tim bre!'); return; }

      const data = apiCache[liga] || {};
      const fb = teamsDataFallback[liga] || {};

      const teams = tims.map(t => {
        const strength = data[t]?.strength || fb[t] || 75;
        const logo = data[t]?.logo || null;
        return { name: t, strength, logo };
      });

      const total = teams.reduce((sum, t) => sum + t.strength, 0);
      teams.forEach(t => t.pct = Math.round((t.strength / total) * 85));
      const drawPct = 100 - teams.reduce((sum, t) => sum + t.pct, 0);
      teams.sort((a, b) => b.pct - a.pct);

      const rows = teams.map((t, i) => {
        const winnerClass = i === 0 ? 'winner-row' : '';
        const logoHtml = t.logo ? `<img src="${t.logo}" alt="${t.name}" onerror="this.parentNode.textContent='${getInitials(t.name)}'">` : getInitials(t.name);
        return `
          <div class="compare-team-row ${winnerClass}">
            <div class="compare-logo">${logoHtml}</div>
            <div class="compare-info"><div class="compare-name">${t.name}</div></div>
            <div class="compare-pct">${t.pct}%</div>
          </div>
        `;
      }).join('');

      document.getElementById('compareRows').innerHTML = rows +
        `<div style="text-align:center;font-size:11px;color:#a1a1aa;margin-top:10px;">Draw: ${drawPct}%</div>`;

      document.getElementById('compareResult').classList.add('show');
    });

    // MODE SWITCH
    function switchMode(mode) {
      if (mode === 'duel') {
        document.getElementById('modeDuel').style.display = 'block';
        document.getElementById('modeCompare').style.display = 'none';
        document.getElementById('tabDuel').classList.add('active');
        document.getElementById('tabCompare').classList.remove('active');
      } else {
        document.getElementById('modeDuel').style.display = 'none';
        document.getElementById('modeCompare').style.display = 'block';
        document.getElementById('tabDuel').classList.remove('active');
        document.getElementById('tabCompare').classList.add('active');
      }
    }

    // HISTORY
    function loadHistory() {
      try {
        const h = JSON.parse(localStorage.getItem('skorduel_history') || '[]');
        renderHistory(h);
      } catch(e) {}
    }
    function saveHistory(item) {
      try {
        let h = JSON.parse(localStorage.getItem('skorduel_history') || '[]');
        h.unshift({ ...item, time: Date.now() });
        h = h.slice(0, 10);
        localStorage.setItem('skorduel_history', JSON.stringify(h));
        renderHistory(h);
      } catch(e) {}
    }
    function renderHistory(h) {
      const el = document.getElementById('historyList');
      if (!h.length) { el.innerHTML = '<div class="history-empty">Belum ada history</div>'; return; }
      el.innerHTML = h.map(i => `
        <div class="history-item">
          <span class="hi-match">${i.match}</span>
          <span class="hi-winner">${i.winner}</span>
        </div>
      `).join('');
    }
    function clearHistory() {
      localStorage.removeItem('skorduel_history');
      renderHistory([]);
    }

    // SHARE
    function shareTo(platform) {
      if (!lastResult.timA) { alert('Prediksi dulu bre sebelum share!'); return; }
      const { timA, timB, pctA, pctB, pctDraw, winner } = lastResult;
      const text = `⚽ *SkorDuel* — Prediksi Pertandingan\n\n${timA} vs ${timB}\n\n🏆 ${timA}: ${pctA}%\n🤝 Draw: ${pctDraw}%\n🏆 ${timB}: ${pctB}%\n\n${winner}\n\n🔮 Cek prediksi tim favoritmu di:\nhttps://skorduel.pages.dev`;

      if (platform === 'wa') window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      else if (platform === 'tw') { const t = `⚽ ${timA} vs ${timB}\n\n${timA}: ${pctA}%\nDraw: ${pctDraw}%\n${timB}: ${pctB}%\n\nskorduel.pages.dev`; window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(t)}`, '_blank'); }
      else if (platform === 'copy') { navigator.clipboard.writeText(text).then(() => alert('✅ Di-copy!')).catch(() => alert('❌ Gagal copy')); }
      else if (platform === 'link') { navigator.clipboard.writeText('https://skorduel.pages.dev').then(() => alert('✅ Link SkorDuel di-copy!')).catch(() => alert('❌ Gagal copy')); }
    }

    // MODAL
    const modalData = {
      howto: `
        <h2>❓ Cara Kerja SkorDuel</h2>
        <p>SkorDuel menggunakan <strong>model statistik sederhana</strong> berbasis performa tim untuk memprediksi peluang menang.</p>
        <h3>📊 Sumber Data</h3>
        <ul>
          <li><strong>Liga top Eropa</strong> (PL, La Liga, Serie A, Bundesliga, Ligue 1, Eredivisie, Primeira Liga, Championship): data live dari Football-Data.org</li>
          <li><strong>Liga lainnya</strong>: data manual berdasarkan peringkat terkini</li>
        </ul>
        <h3>🧮 Rumus Prediksi</h3>
        <ul>
          <li>Skor kekuatan = (poin/pertandingan ÷ poin maks) × 45 + 50</li>
          <li>Peluang menang = (skor tim ÷ total skor) × 85%</li>
          <li>Draw = 15% (bobot tetap)</li>
        </ul>
        <h3>⚠️ Disclaimer</h3>
        <p>Prediksi ini <strong>hanya estimasi statistik</strong>, bukan jaminan hasil. Faktor tak terduga (cedera, cuaca, mental) tidak dihitung. Gunakan sebagai referensi, bukan patokan mutlak.</p>
        <button class="modal-close" onclick="closeModal()">Mengerti</button>
      `,
      about: `
        <h2>ℹ️ Tentang SkorDuel</h2>
        <p>SkorDuel adalah <strong>alat prediksi pertandingan sepak bola</strong> sederhana yang menggabungkan data live dengan analisis statistik.</p>
        <h3>🎯 Tujuan</h3>
        <p>Memberikan gambaran cepat peluang menang antar tim, tanpa perlu hitung manual.</p>
        <h3>🛠️ Teknologi</h3>
        <ul>
          <li>Cloudflare Pages (hosting)</li>
          <li>Cloudflare Workers (API proxy)</li>
          <li>Football-Data.org (data klasemen)</li>
          <li>HTML/CSS/JavaScript murni (tanpa framework)</li>
        </ul>
        <h3>📅 Versi</h3>
        <p>v2.0 — 2025</p>
        <button class="modal-close" onclick="closeModal()">Tutup</button>
      `
    };

    function openModal(type) {
      document.getElementById('modalContent').innerHTML = modalData[type] || '';
      document.getElementById('modalOverlay').classList.add('show');
    }
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
    }

    // INIT
    loadHistory();
  </script>
</body>
</html>
